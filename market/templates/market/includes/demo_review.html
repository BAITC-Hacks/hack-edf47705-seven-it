<article class="demo-review">
  <header><span class="review-avatar" aria-hidden="true">{{ review.initial }}</span><div><strong>{{ review.name }}</strong><span>Демо-участник</span></div><span class="review-stars" aria-label="Оценка {{ review.rating }} из 5">{{ review.stars }}</span></header>
  <p>{{ review.text }}</p><footer><span>Вымышленный отзыв</span><span>{{ review.day }}</span></footer>
</article>
